apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-laf
  namespace: ns-0ssmjp0n
  labels:
    app: campus-laf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-laf
  template:
    metadata:
      labels:
        app: campus-laf
    spec:
      containers:
        - name: campus-laf
          image: zxseric/campus-lost-and-found:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: DEBUG
              value: "False"
            - name: SECRET_KEY
              value: "campus-laf-sealos-prod-secret-2024-xjt"
            - name: ALLOWED_HOSTS
              value: "*"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/items/
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/items/
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: campus-laf
  namespace: ns-0ssmjp0n
spec:
  selector:
    app: campus-laf
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campus-laf
  namespace: ns-0ssmjp0n
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - host: campus-laf.cloud.sealos.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campus-laf
                port:
                  number: 80
  tls:
    - hosts:
        - campus-laf.cloud.sealos.io
      secretName: wildcard-cloud-sealos-io-cert
